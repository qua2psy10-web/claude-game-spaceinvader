<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Space Invaders</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E👾%3C/text%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000010;
      font-family: 'Courier New', monospace;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    /* ---- HUD ---- */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 12px 18px;
      color: #7dffb0;
      text-shadow: 0 0 8px rgba(125, 255, 176, 0.8);
      font-size: clamp(13px, 2.2vw, 18px);
      letter-spacing: 0.1em;
      pointer-events: none;
      z-index: 10;
    }
    #hud .block { text-align: center; }
    #hud .label { font-size: 0.75em; opacity: 0.8; }
    #hud .value { font-size: 1.3em; font-weight: bold; }
    #lives { color: #6fd6ff; text-shadow: 0 0 8px rgba(111, 214, 255, 0.8); }

    /* ---- Center overlay (title / game over) ---- */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 18px;
      color: #fff;
      text-align: center;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #overlay.hidden { opacity: 0; }
    #overlay h1 {
      font-size: clamp(28px, 7vw, 64px);
      letter-spacing: 0.15em;
      color: #7dffb0;
      text-shadow: 0 0 20px rgba(125, 255, 176, 0.9), 0 0 60px rgba(125, 255, 176, 0.5);
    }
    #overlay .sub {
      font-size: clamp(14px, 3vw, 22px);
      color: #6fd6ff;
      text-shadow: 0 0 12px rgba(111, 214, 255, 0.8);
    }
    #overlay .blink { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.15; } }
    #overlay .msg {
      font-size: clamp(16px, 4vw, 30px);
      color: #ff6f9c;
      text-shadow: 0 0 16px rgba(255, 111, 156, 0.9);
    }

    /* ---- Mute button ---- */
    #btn-mute {
      position: fixed;
      top: 74px; right: 18px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(125, 255, 176, 0.5);
      background: rgba(125, 255, 176, 0.08);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      z-index: 40;
      touch-action: none;
    }
    #btn-mute.muted { opacity: 0.45; }

    /* ---- Touch controls ---- */
    #touch-ui {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: none;
      justify-content: space-between;
      padding: 0 4vw calc(14px + env(safe-area-inset-bottom));
      z-index: 30;
    }
    body.touch #touch-ui { display: flex; }
    .tbtn {
      width: clamp(64px, 17vw, 96px);
      height: clamp(64px, 17vw, 96px);
      border-radius: 50%;
      border: 2px solid rgba(125, 255, 176, 0.6);
      background: rgba(125, 255, 176, 0.08);
      color: #7dffb0;
      font-size: clamp(22px, 6vw, 34px);
      font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
    }
    .tbtn:active, .tbtn.pressed { background: rgba(125, 255, 176, 0.3); }
    #btn-fire {
      border-color: rgba(255, 111, 156, 0.6);
      background: rgba(255, 111, 156, 0.08);
      color: #ff6f9c;
    }
    #btn-fire:active, #btn-fire.pressed { background: rgba(255, 111, 156, 0.3); }
    .tgroup { display: flex; gap: 4vw; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="block">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="block">
      <div class="label">HI-SCORE</div>
      <div class="value" id="hiscore">0</div>
    </div>
    <div class="block">
      <div class="label">WAVE</div>
      <div class="value" id="wave">1</div>
    </div>
    <div class="block">
      <div class="label">LIVES</div>
      <div class="value" id="lives">▲ ▲ ▲</div>
    </div>
  </div>

  <button id="btn-mute" aria-label="サウンド ON/OFF">🔊</button>

  <div id="overlay">
    <h1 id="overlay-title">3D SPACE INVADERS</h1>
    <div class="msg" id="overlay-msg"></div>
    <div class="sub blink" id="overlay-sub">PRESS SPACE OR TAP TO START</div>
  </div>

  <div id="touch-ui">
    <div class="tgroup">
      <button class="tbtn" id="btn-left" aria-label="左に移動">◀</button>
      <button class="tbtn" id="btn-right" aria-label="右に移動">▶</button>
    </div>
    <button class="tbtn" id="btn-fire" aria-label="発射">●</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
